<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DevMatryca</title>

  <!-- Windows 7 UI framework -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/7.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;

      /* Windows 7-ish desktop */
      background:
        linear-gradient(
          rgba(20, 60, 105, 0.12),
          rgba(0, 0, 0, 0.08)
        ),
        url("https://i.imgur.com/5KQ7K6M.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      padding: 35px;
    }

    /* Dark translucent desktop overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,.10),
          transparent 45%
        );

      z-index: -1;
    }

    .desktop {
      width: 100%;
      min-height: calc(100vh - 70px);

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 20px;
    }

    /* Main DevMatryca window */
    .main-window {
      width: min(950px, 100%);
    }

    .window-body {
      overflow: hidden;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 25px;

      padding: 22px;

      min-height: 190px;
    }

    .avatar {
      width: 130px;
      height: 130px;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid white;

      box-shadow:
        0 2px 7px rgba(0,0,0,.45);
    }

    .hero-text h1 {
      margin: 0 0 7px;

      font-size: 34px;
      font-weight: 600;

      color: #222;
    }

    .hero-text p {
      margin: 0 0 18px;

      color: #444;
      font-size: 15px;
    }

    /* Roblox button */
    .roblox-button {
      display: inline-flex;

      align-items: center;
      gap: 8px;

      text-decoration: none;

      color: #111;
    }

    .roblox-logo {
      width: 18px;
      height: 18px;

      object-fit: contain;
    }

    /* Separator */
    .separator {
      height: 1px;

      margin: 5px 15px 15px;

      background: #c7c7c7;

      border-top: 1px solid white;
    }

    .section {
      padding: 0 15px 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;

      margin: 10px 0 12px;
    }

    /* Fanart */
    .fanart-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );

      gap: 12px;

      align-items: start;
    }

    .fanart {
      position: relative;

      padding: 4px;

      cursor: pointer;

      background: #f3f3f3;

      border: 1px solid #999;

      border-radius: 2px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.3);

      transition:
        transform .12s ease,
        box-shadow .12s ease;
    }

    .fanart:hover {
      transform: translateY(-2px);

      box-shadow:
        0 4px 9px rgba(0,0,0,.35);
    }

    .fanart img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #aaa;
    }

    .fanart-label {
      position: absolute;

      left: 7px;
      bottom: 7px;

      padding: 2px 6px;

      color: white;

      font-size: 11px;

      background: rgba(0,0,0,.65);

      border-radius: 2px;
    }

    /* Empty fanart message */
    .empty {
      padding: 25px;

      text-align: center;

      color: #555;

      border: 1px dashed #aaa;

      background: rgba(255,255,255,.5);
    }

    /* Thanks */
    .thanks {
      padding: 15px;

      background:
        linear-gradient(
          #fff,
          #f0f0f0
        );

      border: 1px solid #aaa;

      box-shadow:
        inset 0 1px white;
    }

    .thanks p {
      margin-top: 0;
    }

    .names {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }

    .name {
      padding: 5px 9px;

      border: 1px solid #aaa;

      border-radius: 2px;

      background:
        linear-gradient(
          #fff,
          #e8e8e8
        );

      box-shadow:
        inset 0 1px white;

      font-size: 13px;
    }

    /* Footer */
    .footer {
      text-align: center;

      color: #444;

      padding: 10px;

      font-size: 12px;
    }

    /* Fanart popup */
    .viewer {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        rgba(0, 0, 0, .42);

      z-index: 1000;
    }

    .viewer.active {
      display: flex;
    }

    .viewer-window {
      width: min(1000px, 94vw);
      max-height: 92vh;
    }

    .viewer-content {
      display: flex;
      justify-content: center;

      padding: 10px;

      background: #eee;

      overflow: auto;
    }

    .viewer-content img {
      max-width: 100%;
      max-height: 78vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border: 1px solid #888;

      box-shadow:
        0 2px 8px rgba(0,0,0,.35);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .desktop {
        min-height: calc(100vh - 20px);
      }

      .hero {
        flex-direction: column;

        text-align: center;
      }

      .hero-text h1 {
        font-size: 28px;
      }

      .avatar {
        width: 110px;
        height: 110px;
      }

      .fanart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="desktop">

    <!-- Main application window -->
    <div class="window active main-window">

      <div class="title-bar">
        <div class="title-bar-text">
          DevMatryca
        </div>

        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="window-body has-space">

        <!-- Profile -->
        <section class="hero">

          <img
            src="avatar.png"
            alt="DevMatryca avatar"
            class="avatar"
          >

          <div class="hero-text">

            <h1>DevMatryca</h1>

            <p>
              Developer, creator and fanart enjoyer.
            </p>

            <a
              class="button roblox-button"
              href="https://www.roblox.com/users/4963370209/profile"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="roblox-logo"
                src="https://api.iconify.design/simple-icons:roblox.svg"
                alt=""
              >

              Roblox
            </a>

          </div>

        </section>

        <div class="separator"></div>

        <!-- Fanarts -->
        <section class="section">

          <div class="section-title">
            Fanarts
          </div>

          <div
            id="fanart-grid"
            class="fanart-grid"
          ></div>

        </section>

        <div class="separator"></div>

        <!-- Thanks -->
        <section class="section">

          <div class="section-title">
            Thank you to
          </div>

          <div class="thanks">

            <p>
              Thanks to everyone who helped, inspired,
              or contributed to DevMatryca.
            </p>

            <div class="names">

              <span class="name">Siri</span>
              <span class="name">Moony</span>
              <span class="name">T420User</span>
              <span class="name">artlurg431</span>
              <span class="name">Vadimmka</span>

            </div>

          </div>

        </section>

        <div class="footer">
          © <span id="year"></span> DevMatryca
        </div>

      </div>
    </div>

  </div>


  <!-- Fanart viewer -->
  <div
    id="viewer"
    class="viewer"
  >

    <div
      class="window active viewer-window"
    >

      <div class="title-bar">

        <div
          id="viewer-title"
          class="title-bar-text"
        >
          Fanart
        </div>

        <div class="title-bar-controls">

          <button
            aria-label="Close"
            id="viewer-close"
          ></button>

        </div>

      </div>

      <div class="window-body viewer-content">

        <img
          id="viewer-image"
          src=""
          alt=""
        >

      </div>

    </div>

  </div>


  <script>

    /*
     * -----------------------------------------
     * FANART AUTO DISCOVERY
     * -----------------------------------------
     *
     * Automatically loads:
     *
     * fanart1.png
     * fanart2.png
     * fanart3.png
     * ...
     *
     * No need to edit the HTML when adding art.
     */

    const grid =
      document.getElementById("fanart-grid");

    const MAX_FANARTS = 100;

    let found = 0;


    function createFanart(number) {

      return new Promise(resolve => {

        const src =
          `fanart${number}.png`;

        const test =
          new Image();

        test.onload = () => {

          const card =
            document.createElement("div");

          card.className =
            "fanart";

          const img =
            document.createElement("img");

          img.src = src;

          img.alt =
            `Fanart ${number}`;

          img.loading =
            "lazy";


          const label =
            document.createElement("span");

          label.className =
            "fanart-label";

          label.textContent =
            `fanart${number}.png`;


          card.appendChild(img);
          card.appendChild(label);


          card.addEventListener(
            "click",
            () => openViewer(
              src,
              `Fanart ${number}`
            )
          );


          grid.appendChild(card);

          found++;

          resolve(true);

        };


        test.onerror = () => {
          resolve(false);
        };


        test.src = src;

      });

    }


    async function loadFanarts() {

      const jobs = [];

      for (
        let i = 1;
        i <= MAX_FANARTS;
        i++
      ) {

        jobs.push(
          createFanart(i)
        );

      }

      await Promise.all(jobs);


      if (found === 0) {

        grid.innerHTML = `
          <div class="empty">
            No fanarts found.<br><br>

            Add images named:
            <strong>fanart1.png</strong>,
            <strong>fanart2.png</strong>,
            <strong>fanart3.png</strong>...
          </div>
        `;

      }

    }


    /*
     * -----------------------------------------
     * FANART VIEWER
     * -----------------------------------------
     */

    const viewer =
      document.getElementById("viewer");

    const viewerImage =
      document.getElementById("viewer-image");

    const viewerTitle =
      document.getElementById("viewer-title");

    const viewerClose =
      document.getElementById("viewer-close");


    function openViewer(
      src,
      title
    ) {

      viewerImage.src =
        src;

      viewerImage.alt =
        title;

      viewerTitle.textContent =
        title;

      viewer.classList.add(
        "active"
      );

    }


    function closeViewer() {

      viewer.classList.remove(
        "active"
      );

      viewerImage.src =
        "";

    }


    viewerClose.addEventListener(
      "click",
      closeViewer
    );


    viewer.addEventListener(
      "click",
      event => {

        if (
          event.target === viewer
        ) {

          closeViewer();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeViewer();

        }

      }
    );


    /*
     * -----------------------------------------
     * YEAR
     * -----------------------------------------
     */

    document.getElementById(
      "year"
    ).textContent =
      new Date().getFullYear();


    /*
     * -----------------------------------------
     * START
     * -----------------------------------------
     */

    loadFanarts();

  </script>

</body>
</html>
